[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmic-evolution"
version = "0.1.0"
description = "Computational investigation of cosmic spacetime evolution: research prototype"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Project authors (placeholder)" }]
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "nbformat>=5", "nbclient>=0.8", "ipykernel"]

[project.scripts]
cosmic-evolution = "cosmic_evolution.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
